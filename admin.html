<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Panel Administrador - Los Naranjos D-114</h1>

<form id="objetivoForm">
  <input id="nombre" placeholder="Nombre del objetivo" required>

 <input
    type="text"
    id="descripcion"
    placeholder="Descripción del objetivo">

  <input id="precio" type="number" placeholder="Precio total del objetivo" required>

  <input id="recaudado" type="number" placeholder="Monto ya recaudado" value="0" required>

  <label>
    <input id="urgente" type="checkbox">
    Marcar como urgente
  </label>

  <button type="submit">Agregar Objetivo</button>
</form>

<h2>Objetivos cargados</h2>
<div id="listaObjetivos"></div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
